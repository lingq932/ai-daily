name: 历史数据回填

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: '开始日期 (YYYY-MM-DD)'
        required: true
        default: '2026-04-21'
      date_to:
        description: '结束日期 (YYYY-MM-DD)'
        required: true
        default: '2026-05-15'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run backfill
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/batch_backfill.py \
            --from "${{ github.event.inputs.date_from }}" \
            --to "${{ github.event.inputs.date_to }}"

      - name: Commit and push
        run: |
          git config user.name "AI Daily Bot"
          git config user.email "bot@ai-daily.local"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "data: backfill ${{ github.event.inputs.date_from }} ~ ${{ github.event.inputs.date_to }}"
            git push
          fi
